<article class="property-card">
  <div class="property-media">${media}</div>
  <div class="property-content">
    ${note}
    <p class="property-price">${price}</p>
    <h3>${title}</h3>
    <p class="property-location">${location}</p>
    ${facts}
    <a class="property-link" href="${url}">Подробнее об объекте <span aria-hidden="true">↗</span></a>
  </div>
</article>
